<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Żarówka — standalone</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
      }

      #bulb-demo {
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div id="bulb-demo"></div>

    <script type="module">
      import { MomentumLightbulb } from "./src/index.js";

      const widget = MomentumLightbulb.mount("#bulb-demo");
      window.replayBulb = () => widget.play();
    </script>
  </body>
</html>
